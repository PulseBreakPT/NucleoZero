name: Compilar APK Android (debug)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GODOT_VERSION: 4.5.2
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataformas e ferramentas Android
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'build-tools;35.0.0' 'platforms;android-35'

      - name: Instalar Godot e modelos de exportação
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION-stable"
          curl --fail -L --retry 3 -o /tmp/godot.zip "$BASE/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          install -m 755 "/tmp/Godot_v$GODOT_VERSION-stable_linux.x86_64" /usr/local/bin/godot
          curl --fail -L --retry 3 -o /tmp/templates.tpz "$BASE/Godot_v$GODOT_VERSION-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable"
          mkdir -p /tmp/export_templates
          unzip -q /tmp/templates.tpz -d /tmp/export_templates
          cp /tmp/export_templates/templates/* "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable/"
          godot --version

      - name: Importar projeto
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --quit
          mkdir -p "$HOME/.config/godot"
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path.home() / '.config/godot/editor_settings-4.5.tres'
          content = path.read_text() if path.exists() else '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'
          sdk = os.environ.get("ANDROID_HOME", os.environ.get("ANDROID_SDK_ROOT", ""))
          jdk = os.environ.get("JAVA_HOME", "")
          assert sdk and jdk, "Android SDK ou Java em falta"
          config = '\nexport/android/android_sdk_path = "' + sdk + '"\nexport/android/java_sdk_path = "' + jdk + '"\n'
          if '[resource]' in content:
              content = content.replace('[resource]', '[resource]' + config, 1)
          else:
              content += '\n[resource]\n' + config
          path.write_text(content)
          print('SDK:',sdk,'JAVA:',jdk)
          PY

      - name: Testar lógica incremental
        run: godot --headless --path . --script res://tests/smoke_test.gd

      - name: Verificar arranque do jogo
        run: godot --headless --path . --quit-after 8

      - name: Preparar chave de teste
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname 'CN=NucleoZero Debug,O=PulseBreakPT,C=PT'
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - name: Exportar APK Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug Android build/NucleoZero.apk
          test -s build/NucleoZero.apk
          unzip -t build/NucleoZero.apk | tail -1
          unzip -Z1 build/NucleoZero.apk | grep -q '^lib/arm64-v8a/'
          du -h build/NucleoZero.apk

      - name: Disponibilizar APK para instalação
        uses: actions/upload-artifact@v4
        with:
          name: NucleoZero-Android-APK
          path: build/NucleoZero.apk
          if-no-files-found: error
          retention-days: 30
